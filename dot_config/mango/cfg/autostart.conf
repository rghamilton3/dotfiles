# | Auto Start |
# autostart your favorite applications here

exec-once = noctalia &

# Pre-launch ytm-player in its scratchpad terminal so it's instantly ready
# when toggled (see keybinds.conf, SUPER+y). Matched by the
# com.local.ytmscratch appid via the windowrule in rules.conf.
exec-once = ghostty --class=com.local.ytmscratch --gtk-single-instance=false -e ytm &
